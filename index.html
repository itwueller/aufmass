<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Aufmaß Schaltermaterial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: eine Spalte wie ein Klemmbrett – Kopf, Positionen nach Raum, Materialliste; untere Leiste für die Hauptaktion */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#d9dee6; --fg:#16202c; --muted:#5b6778;
  --accent:#1d5bd6; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --copper:#a8541f; --danger:#c0362c; --ok:#2f7d4f;
  --mark:#fff799; --mark-ink:#16202c; --mark-edge:#d9c400;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --line:#2b3644; --fg:#e7ecf2; --muted:#9aa6b6;
  --accent:#5b8ff0; --accent-ink:#0c1320; --accent-soft:#1d2a40; --copper:#e08a52; --danger:#ff6b5e; --ok:#5cc58a; --mark:#e8d73a; --mark-ink:#16202c; --mark-edge:#fff14d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --line:#2b3644; --fg:#e7ecf2; --muted:#9aa6b6;
  --accent:#5b8ff0; --accent-ink:#0c1320; --accent-soft:#1d2a40; --copper:#e08a52; --danger:#ff6b5e; --ok:#5cc58a; --mark:#e8d73a; --mark-ink:#16202c; --mark-edge:#fff14d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.ver{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;text-align:center;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.7rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.status{font-size:.8rem;color:var(--muted)}
.status.warn{color:var(--copper)}
.list{display:grid;gap:10px}
.brandbar{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand img{display:block;height:32px;width:auto;max-width:100%;background:#fff;border-radius:5px;padding:4px 7px;margin-left:-7px}
.search{position:relative;display:block}
label.f{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(10,20,35,.2);max-height:min(300px,45vh);overflow-y:auto;overscroll-behavior:contain;text-transform:none;letter-spacing:0}
.ac-opt{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;min-height:44px;font-size:1rem;font-weight:400;color:var(--fg)}
.ac-opt:last-child{border-bottom:0}
.ac-opt b{font-weight:700;color:var(--accent)}
.ac-opt:hover,.ac-opt.akt{background:var(--accent-soft)}
.search input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1rem;margin-bottom:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.job{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.job-open{display:grid;gap:4px;text-align:left;background:none;border:0;padding:0;min-width:0}
.job .t{font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.job .s{color:var(--muted);font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.job .t .a{font-weight:500;color:var(--muted)}
.job .c{font-family:var(--f-head);font-size:1.4rem;color:var(--copper);text-align:right;line-height:1}
.job-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.job-actions .btn{flex:1;max-width:160px}
.job-side{display:flex;gap:8px;align-items:center}
.sich{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sich.alt{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 10%,var(--surface))}
.job-side .btn{min-height:44px}
@media (max-width:480px){.job{grid-template-columns:1fr}.job-side{justify-content:flex-end}}
@media (max-width:400px){#app h1{font-size:1.3rem;line-height:1.2}}
.bar .kurz{display:none}
@media (max-width:420px){.bar .lang{display:none}.bar .kurz{display:inline}}
@media (max-width:480px){.mat td:first-child{width:44px}.mat td.n{width:3.4em;white-space:nowrap;padding-left:4px}.mat td{overflow-wrap:anywhere}}
.confirm-inline b{color:var(--danger);margin-right:auto}
.job .c small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted)}
.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;display:grid;gap:12px;justify-items:center}
.tabs{display:flex;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font:inherit;font-weight:600;font-size:.98rem;color:var(--fg);cursor:pointer;transition:background .15s}
.tabs button:hover{background:var(--accent-soft)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:800;box-shadow:inset 0 -3px 0 var(--accent)}
@media (max-width:400px){.tabs{gap:2px;padding:4px}.tabs button{font-size:.86rem;padding:0 4px;min-width:0}}
@media (max-width:360px){.tabs{gap:2px;padding:3px}.tabs button{flex:1 1 auto;font-size:.74rem;padding:0 3px;letter-spacing:-.01em}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label.f input,label.f textarea,label.f select{text-transform:none;letter-spacing:0;font-size:1rem;font-weight:400;color:var(--fg);min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%}
label.f textarea{min-height:72px;resize:vertical}
.full{grid-column:1/-1}
.room{margin-top:18px}
.btn.small.ico.stift{padding:0;min-width:28px;width:28px;min-height:28px;height:28px;border-radius:7px}
.roomadd{margin-top:10px;gap:8px}
.fg-h{grid-column:1/-1;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.fg-h:first-child{margin-top:0}
.fgrid{position:relative}
.fgrid label.sonst{position:static;display:block;min-width:0}
.fgrid label.sonst input{display:block;width:100%;height:100%;min-height:40px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem;line-height:1.2;color:var(--fg)}
.fgrid label.sonst input::placeholder{color:var(--fg);opacity:1}
.fgrid label.sonst.aktiv input{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.fields .ac-list,.search .ac-list{position:static;margin-top:6px;max-height:min(260px,36vh)}
.sheet .ac-list{position:static;margin-top:6px;max-height:min(260px,36vh);scroll-margin-bottom:96px;scroll-margin-top:80px}
.ac-opt{white-space:normal;overflow-wrap:anywhere}
.zeile2{display:grid;grid-template-columns:repeat(2,max-content);gap:12px 18px;justify-content:start}
.zeile2 .seg{flex-wrap:nowrap;gap:6px}
@media (max-width:560px){.zeile2{grid-template-columns:1fr;gap:10px}.zeile2>div{min-width:0}.zeile2 .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}.zeile2 .seg button{padding:0 3px;min-width:0;font-size:.84rem;line-height:1.15;hyphens:manual}}
.sl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sl-h .sl{margin-bottom:0}
svg.rahmen{display:block;height:46px;width:auto;max-width:62%;flex:none}
svg.rahmen.senk{height:auto;width:46px}
/* ---------- Handy & iPad ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;box-shadow:0 0 0 6px var(--bg)}
.sheet>.row:first-child{position:sticky;top:-18px;z-index:40;background:var(--bg);margin:-18px 0 -6px;padding:14px 0 8px}
.sheet>.row:last-child:not(:first-child){position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:40;background:var(--bg);margin:0 0 calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media (max-width:600px){
  h1{font-size:1.4rem;line-height:1.2}
  .job .t{font-size:1rem}
}
@media (pointer:coarse){
  .btn.small{min-height:42px}
  .btn.small.ico{min-width:42px}
  .btn.small.ico.stift{min-width:32px;width:32px;min-height:32px;height:32px}
  .fgrid button{min-height:42px}
}
@media (min-width:700px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-width:680px;max-height:88vh;max-height:88dvh}
  .sheet>.row:last-child:not(:first-child){bottom:-18px;margin-bottom:-18px;padding-bottom:14px}
  .fgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (min-width:900px){
  .wrap,.ver,.brand{max-width:1120px}
  .bar .btn{max-width:300px}
  .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sich{max-width:640px}
  #app>.mkinfo,#app .mat{max-width:900px}
  h1{font-size:1.9rem}
}
.room,.etage,.pos{border-radius:10px}
.blink{animation:blink 1.5s ease-out}
@keyframes blink{0%,25%{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
.etage.blink{animation-name:blinkEt}
@keyframes blinkEt{0%,25%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.blink,.etage.blink{animation-duration:.01s}}
.etage{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:26px;padding:8px 12px;background:var(--accent-soft);border-radius:10px}
.etage h2{color:var(--fg)}
.inet{margin-left:12px}
label.f select{appearance:auto}
.room-h h3{font-size:1.2rem}
.room-n{display:flex;align-items:center;gap:8px;min-width:0}
.room-n h2,.room-n h3{min-width:0;overflow-wrap:normal;word-break:normal;hyphens:auto;-webkit-hyphens:auto}
.etage h2{font-size:clamp(1.05rem,4.8vw,1.25rem)}
@media (max-width:400px){.stz{display:none}.room-h h3{font-size:1.1rem}.etage{padding:8px 8px 8px 10px}}
@media (max-width:360px){.etage h2{font-size:1rem}.etage .room-n{gap:6px}}
@media (max-width:360px) and (pointer:coarse){.room-h .btn.small.ico:not(.stift),.etage .btn.small.ico:not(.stift){min-width:38px;min-height:38px}}
.room-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--fg);margin-bottom:8px}
.room-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabsH,0px) + 6px + var(--etH,0px));z-index:2;background:var(--bg);padding-top:6px}
.etage{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabsH,0px) + 6px);z-index:3;box-shadow:0 -6px 0 var(--bg)}
.pos{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
/* Gruppierung deutlicher: Etage = kräftiges Band, Raum = eigene Karte, Stellen darin */
.etage{background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin-top:30px;box-shadow:inset 0 -3px 0 var(--accent),0 0 0 0 transparent}
.etage h2{color:var(--fg)!important;font-size:clamp(1.15rem,5vw,1.4rem);font-weight:800;letter-spacing:.02em}
.etblock.mitet{margin-top:26px;background:var(--bg);border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:16px;padding:0 1px 2px}
.etblock.mitet>.etage{margin:0 -1px;border:0;border-radius:15px 15px 0 0;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.etblock.mitet>.raeume{padding-top:2px}
.etblock.mitet .room:first-child{margin-top:2px}
.etblock.mitet .room{margin-top:2px}
.room.inet{margin-left:0}
.room{background:var(--surface);border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:0 12px 12px;margin-top:14px;box-shadow:0 1px 3px rgba(10,20,35,.06)}
.room-h{background:var(--surface)!important;border-bottom:2px solid color-mix(in srgb,var(--accent) 45%,transparent)!important;margin:0 -12px 4px!important;padding:10px 12px 8px!important;border-radius:12px 12px 0 0}
.room-h h3{font-size:1.15rem}
.room .pos:has(+ .roomadd),.room .pos:has(+ p){border-bottom:0}
.etage h2,.room-h h3{hyphens:manual!important;-webkit-hyphens:manual!important;overflow-wrap:normal!important;word-break:normal!important}
@media (max-width:480px){.etage h2{font-size:1.12rem!important}.etage{padding:8px 8px 8px 10px!important}}
.room-h h3{font-size:1.32rem!important}
@media (max-width:480px){.room-h h3{font-size:1.2rem!important}}
@media (max-width:360px){.room-h h3{font-size:1.08rem!important}}
@media (max-width:360px){.etage h2{font-size:.98rem!important;letter-spacing:0}.etage .btn.small.ico:not(.stift){min-width:36px!important;min-height:36px!important}.etage .row{gap:4px!important}}
@media (min-width:900px){.pos.stelle .pv{width:130px}.pos.stelle .d{grid-template-columns:130px 1fr}.wrap{max-width:980px}.ver,.brand{max-width:980px}}
.room .roomadd{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
@media (max-width:480px){.etblock.mitet{padding:0 1px 2px}.etblock.mitet>.etage{margin:0 -1px}.room{padding:0 8px 10px}.room-h{margin:0 -8px 4px!important;padding:8px 8px 6px!important}}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.ico{min-width:40px;padding:0;font-size:1.05rem}
.btn.ico.del{color:var(--danger)}
.acts .delq{font-weight:700;color:var(--danger);font-size:.9rem;align-self:center}
.chip.zus{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
@media (max-width:640px){.pos{grid-template-columns:auto 1fr}.acts{grid-column:1/-1}}
.pos .q{font-family:var(--f-head);font-size:1.3rem;min-width:2.4ch;text-align:right;color:var(--copper)}
.pos .d{min-width:0}
.pos .d b{display:block;font-weight:600}
.pos .d span{font-size:.88rem;color:var(--muted)}
.pos.stelle{align-items:start}
.pos.stelle .q{padding-top:6px}
.pos.stelle .d{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.pos.stelle .pv{grid-row:1/3;width:164px}
.pos.stelle .pv svg.rahmen{height:38px;max-width:none}
.pos.stelle .pv svg.rahmen.senk{height:auto;width:38px}
.pos.stelle .el{display:flex;flex-direction:column;gap:1px;min-width:0;padding-top:2px}
.pos.stelle .el b{font-weight:600;line-height:1.3}
.pos.stelle .sub{grid-column:2;display:block}
@media (max-width:640px){
  .pos.stelle .d{grid-template-columns:1fr}
  .pos.stelle .pv{grid-row:auto}
  .pos.stelle .sub{grid-column:auto}
}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.chip.ap{background:color-mix(in srgb,var(--copper) 16%,transparent);color:var(--copper)}
.mat{width:100%;border-collapse:collapse}
.mat td,.mat th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mat th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mat .artnr{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.mat .artnr b{color:var(--fg);font-weight:600;letter-spacing:.02em}
.mat .hinw{font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.3}
.mat .hinw.warn{color:var(--danger);font-weight:600}
.kopfadr{font-weight:600;font-size:1.05rem;margin:2px 0 2px;overflow-wrap:anywhere}
.kopfadr .muted{font-weight:400;font-size:.9rem}
.mat .hinw.abw{color:#b45309;font-weight:700}
.abwtx{color:#b45309}
.progbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.progbtn .pt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.progbtn small{color:var(--muted);font-size:.8rem}
.progbtn .aend{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:.92rem;flex-shrink:0}
.progbtn.abw{border-color:#d97706;background:#fff7ed}.progbtn.abw small{color:#b45309;font-weight:600}
.progbox.offen{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.progbox.offen .pfelder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;align-items:start}
.progbox.offen,.fields{position:relative}
.ac-list.schwebend{position:absolute;z-index:30;margin:0;box-sizing:border-box;max-height:240px}
@media (max-width:560px){.progbox.offen .pfelder{grid-template-columns:1fr}}
.mat td.n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;width:4.5em}
.mat tr.mk td:not(:first-child){background:var(--mark);color:var(--mark-ink)}
.mat td:first-child{width:52px;padding-right:0}
.mkbtn{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;color:var(--mark-ink);display:grid;place-items:center}
.mkbtn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark-edge)}
.pos.gk{background:color-mix(in srgb,var(--mark) 45%,transparent);border-radius:10px}
.acts .pmk{margin-left:6px}
.mkinfo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:.92rem}
.mat tr.grp td{border-bottom:2px solid var(--fg);font-family:var(--f-head);font-size:1.05rem;padding-top:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.bar .btn{flex:1 1 0;min-width:0;max-width:360px;padding:0 8px;line-height:1.15;text-align:center}
.bar .btn.bardel{flex:0 0 48px;width:48px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
@media (max-width:480px){.bar{gap:6px}.bar .btn{font-size:.9rem}}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:52px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slots{display:grid;gap:10px}
.slot{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.slot .sl{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}
.fgrid button{min-width:0;white-space:normal;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual;min-height:40px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.86rem;text-align:left;line-height:1.15}
.fgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.preview{display:flex;gap:4px;justify-content:center;padding:6px 0}
.preview .m{width:54px;height:54px;border:2px solid var(--fg);border-radius:8px;display:grid;place-items:center;font-size:.62rem;font-weight:700;text-align:center;padding:2px;line-height:1.1;background:var(--surface)}
.preview.ap .m{border-style:dashed}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:600}
.stepper input{width:72px;text-align:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.2rem;font-weight:600}
.confirm{border:1px solid var(--danger);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fussrow{flex-wrap:nowrap}.fussrow .btn{padding:0 14px}
.stepper.klein{gap:4px;flex-shrink:0}.stepper.klein button{width:40px;height:44px}.stepper.klein input{width:46px;min-height:44px;font-size:1.1rem}
.del-tx svg{display:none}
@media (max-width:360px){.fussrow{gap:6px}.fussrow .btn{padding:0 10px;font-size:.92rem}.stepper.klein button{width:34px}.stepper.klein input{width:38px}.fussrow .del-tx{padding:0;width:44px}.del-tx svg{display:block}.del-tx span{display:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.datalist-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.datalist-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

/* ---------- Speicher ---------- */
function lsLoad(){try{return JSON.parse(localStorage.getItem("aufmass_jobs")||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem("aufmass_jobs",JSON.stringify(jobs))}catch(e){}}

async function init(){
  render();
  const t=setTimeout(()=>{if(mode==="loading"){mode="local";jobs=lsLoad();render()}},10000);
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  try{user=await window.claude?.use?.("user")}catch(e){user=null}
  if(!db){clearTimeout(t);mode="local";jobs=lsLoad();render();return}
  db.collection("aufmasse").onSnapshot(snap=>{
    clearTimeout(t);mode="db";
    const remote=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())}));
    // eigene, noch ungespeicherte Änderungen behalten
    jobs=remote.map(r=>saveTimers[r.id]?(jobs.find(j=>j.id===r.id)||r):r);
    jobs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    if(!document.querySelector(".scrim")&&!document.activeElement?.matches?.("input,textarea,select"))render();
    else if(!openId)render();
  },err=>{clearTimeout(t);mode="local";jobs=lsLoad();render();toast("Server nicht erreichbar – speichere auf diesem Gerät")});
}

function persist(job){
  job.updatedAt=Date.now();
  if(mode!=="db"){lsSave();return}
  clearTimeout(saveTimers[job.id]);
  saveTimers[job.id]=setTimeout(async()=>{
    const data=structuredClone(job);delete data.id;
    try{await db.collection("aufmasse").doc(job.id).set(data)}
    catch(e){toast(e?.code==="invalid_argument"?"Keine Schreibrechte für dieses Aufmaß":"Speichern fehlgeschlagen – bitte erneut versuchen")}
    finally{delete saveTimers[job.id]}
  },700);
}
async function removeJob(id){
  jobs=jobs.filter(j=>j.id!==id);
  if(mode==="db"){try{await db.collection("aufmasse").doc(id).delete()}catch(e){toast("Löschen fehlgeschlagen")}}else lsSave();
}

function bjProg(programm,farbe){

  else c=f.includes("schwarz")?"885":f.includes("anthrazit")?"81":(f.includes("matt")&&/weiss|studio/.test(f))?"884":(!f.trim()||/weiss|studio/.test(f))?"84":null;
  return {key,c,P};

/* Schalterprogramm je Stelle: Standard = Kopfdaten, bei Aufputz IP44 immer Gira */
function stdProg(job,montage){return montage==="AP"?{hersteller:"Gira",programm:"",farbe:""}:{hersteller:job.hersteller||"",programm:job.programm||"",farbe:job.farbe||""}}

function progCtx(pr){
  const hs=(pr.hersteller||"").trim(),herst=!hs||/gira/i.test(hs)?"Gira":hs;
  const gira=herst==="Gira",pg=nA(pr.programm||"");
  const e2=gira&&/(^|\s)e2(\s|$)/.test(pg),e3=gira&&/(^|\s)e3(\s|$)/.test(pg),fc=giraFarbe(pr.farbe);if(e3)fc.s55="03";
  const std55=gira&&(!pg.trim()||/system 55|standard 55/.test(pg));
  const bj=/busch/i.test(herst),bp=bj?bjProg(pr.programm,pr.farbe):null,c=bp?.c;
  const nrE=k=>{
    if(gira)return GIRA.einsatz[k]||giraNr(GIRA.komplett[k],fc.s55);
    if(bj){if(BJ.einsatz[k])return BJ.einsatz[k];if(!c)return null;if(k==="schukoks")return bp.P.ks?`${bp.P.ks}-${c}`:null;return BJ.steck[k]?`${BJ.steck[k]}-${c}`:null}
    return null};

    if(gira)return giraNr(GIRA.abd[k],fc.s55);
    if(bj&&c){const x=bp.P.extra?.[k];if(x)return x[c]||null;return bp.P.abd[k]?`${bp.P.abd[k]}-${c}`:null}

const TR="\u0001";
function material(job){
  const g={ap:{},rahmen:{},einsatz:{},abdeckung:{},dose:{},sonst:{}};
  const apWarn=new Set(),apPruef=new Set(),ctxs={};
  const nrs={},add=(grp,name,q,nr)=>{if(!name||!q)return;g[grp][name]=(g[grp][name]||0)+q;if(nr&&!nrs[grp+"|"+name])nrs[grp+"|"+name]=nr};
  const hw={};const hinw=(e,typ,a)=>{if(!e)return;const h=hw[e]=hw[e]||{ab:new Set(),inkl:false,frei:false,komplett:false,aw44:false};if(typ==="ab")h.ab.add(a);else h[typ]=true};
  for(const p of job.positionen){
    const q=+p.anzahl||0,abw=progAbw(job,p),eff=abw?p.prog:stdProg(job,p.montage);
    const C=ctxs[progLabel(eff)]=ctxs[progLabel(eff)]||progCtx(eff),herst=C.herst,K=s=>abw?s+TR+abw:s;
    if(p.montage==="AP"){
      /* Aufputz (Gira WG AP IP44): passende Kombination als ein Artikel, sonst Einzelgeräte + Verbindungsstücke */
      const n=p.slots.length,v=p.ausrichtung==="v",sl=p.slots,art=t=>K(`${herst} ${C.bj?"ocean":"WG AP"} IP44 ${t}`),apNr=nr=>C.gira?nr:null;
      const alle=x=>sl.every(k=>k===x);let kombi=null;
      if(n===2&&sl[0]==="aus"&&sl[1]==="schukok")kombi=v?["Kombination Aus-/Wechselschalter + SCHUKO senkrecht","417630"]:["Kombination Aus-/Wechselschalter + SCHUKO waagerecht","417730"];
      else if(n===2&&alle("schukok"))kombi=v?["SCHUKO-Steckdose 2-fach senkrecht","478030"]:["SCHUKO-Steckdose 2-fach waagerecht","478130"];
      else if(n===3&&alle("schukok")&&!v)kombi=["SCHUKO-Steckdose 3-fach waagerecht","478930"];
      if(kombi){add("ap",art(kombi[0]),q,apNr(kombi[1]));continue}
      for(const k of sl){const f=fInfo(k),A=AP_ART[k];
        if(A)add("ap",art(A[0]),q,apNr(A[1]));
        else{const t=f?.l||"?",nm=art(t);add("ap",nm,q);if(AP_SONST.some(x=>nA(x)===nA(t)))apPruef.add(nm);else apWarn.add(nm)}}
      if(n>1)add("ap",art(`Verbindungsstück${v?" (senkrecht)":""}`),q*(n-1),apNr("001330"));
      continue;
    }
    /* Komplettgeräte ohne Rahmen (z. B. E-Herd Dose) zählen nicht zum Rahmen */
    const n=p.slots.filter(k=>!fInfo(k)?.ohneRahmen&&!fInfo(k)?.eigenRahmen).length;
    /* Busch-Jaeger Allwetter 44 (UP, IP44): eigener Einsatz mit Klappdeckel und eigener Rahmen */
    {const na=p.slots.filter(k=>fInfo(k)?.eigenRahmen==="aw44").length;if(na){const fa=nA(eff.farbe||""),c=fa.includes("anthrazit")?"35":/alu|silber/.test(fa)?"33":fa.includes("braun")?"31":"34";
      add("rahmen",K(`Busch-Jaeger Allwetter 44 Rahmen ${na}-fach`),q,na<=3?`210${na}-${c}`:null);
      for(const k of p.slots)if(fInfo(k)?.eigenRahmen==="aw44"){const e=K(fInfo(k).e);add("einsatz",e,q,`20 EUGK-${c}-101`);hinw(e,"aw44")}}}
    /* AP-Gehäuse: Rahmen ist im Gehäuse enthalten */
    if(n){if(p.montage==="APG")add("rahmen",K(`${herst} AP-Gehäuse ${n}-fach`),q,C.nrG(n));
    else add("rahmen",K(`Rahmen ${n}-fach`),q,C.nrR(n));}
    for(const k of p.slots){const f=fInfo(k);if(!f||f.eigenRahmen)continue;const e=K(f.e);add("einsatz",e,q,f.frei?null:C.nrE(k));if(f.a)add("abdeckung",K(f.a),q,f.frei?null:C.nrA(k));
      if(f.frei)hinw(e,"frei");else if(f.ohneRahmen)hinw(e,"komplett");else if(f.a)hinw(e,"ab",f.a);else hinw(e,"inkl")}
  }
  for(const x of job.extras||[])add("sonst",x.text,+x.anzahl||0);
  const GK={"Aufputz-Komplettgeräte":"ap","Rahmen / AP-Gehäuse":"rahmen","Einsätze":"einsatz","Wippen / Abdeckungen":"abdeckung","Sonstiges":"sonst"};
  return [
    ["Aufputz-Komplettgeräte",g.ap],["Rahmen / AP-Gehäuse",g.rahmen],["Einsätze",g.einsatz],["Wippen / Abdeckungen",g.abdeckung],["Dosen",g.dose],["Sonstiges",g.sonst]
  ].map(([t,o])=>[t,Object.entries(o).map(([key,q])=>{const [n,abw]=key.split(TR);return {key,n,abw:abw||"",q}})
    .sort((a,b)=>a.n.localeCompare(b.n,"de",{numeric:true})||a.abw.localeCompare(b.abw,"de"))

      t==="Einsätze"?hinweisText(hw[key]):t==="Rahmen / AP-Gehäuse"?(/AP-Gehäuse/.test(n)?{text:"Rahmen im Gehäuse enthalten",warn:false}:null):t==="Aufputz-Komplettgeräte"?(apWarn.has(key)?{text:`Nicht im ${/busch/i.test(n)?"Busch-Jaeger ocean":"Gira WG-AP"}-Sortiment hinterlegt – bitte Artikel prüfen`,warn:true}:/Verbindungsstück/.test(n)?{text:"zum Zusammenbau der Einzelgeräte",warn:false}:apPruef.has(key)?{text:"Komplettgerät – Art.-Nr. beim Großhandel prüfen",warn:false}:{text:"Komplettgerät inkl. Gehäuse und Abdeckung",warn:false}):null,
      abw?n+" | "+abw:n,abw])]).filter(([,r])=>r.length);
}

  <div class="eyebrow">${esc(fmtDatum(job.datum))}</div>
  <h1>${esc(jobName(job))}</h1>
  <div class="kopfadr">${[jobSub(job),(job.einheit||"").trim()].filter(Boolean).map(esc).join(" · ")||`<span class="muted">Adresse / Wohnung noch offen – in den Kopfdaten eintragen</span>`}</div>
  <div class="muted">${esc([job.hersteller,job.programm,job.farbe].filter(Boolean).join(" · ")||"Schalterprogramm noch offen")}</div>
  <div class="tabs" role="tablist">
    ${[["pos","Positionen"],["mat","Materialliste"],["kopf","Kopfdaten"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}
  </div>`;
  if(tab==="kopf")h+=renderKopf(job);
  else if(tab==="mat")h+=renderMat(job);

}
function renderKopf(job){

  const PH={einheit:"z. B. EG links, Whg. 3"};

    ${f("hersteller","Hersteller")}${f("programm","Schalterprogramm")}${f("farbe","Farbe / Material")}

}
const RK=r=>r||"Ohne Raum",SEP="||";

/* Kürzel ausschreiben: EG → Erdgeschoss usw. (gespeichert bleibt, was eingegeben wurde) */
function etName(e){

  if(fest[u])return fest[u];
  let m=u.match(/^(\d+)\s*\.?\s*(OG|UG)$/);if(m)return `${m[1]}. ${m[2]==="OG"?"Obergeschoss":"Untergeschoss"}`;
  return t;
}

function renderMat(job){

function openEditor(job,pos,key){

/* Bewegung beim Umsortieren: alte Lage merken, neu zeichnen, dann vom alten Ort an den neuen gleiten lassen */
const ruhig=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
const flipKey=el=>el.dataset.k?el.dataset.k:el.dataset.room!==undefined?"r:"+el.dataset.room:"e:"+el.dataset.etage;
function flip(update,map,mark){
  map=map||{};
  const vorher={},innen={};
  document.querySelectorAll("#app [data-room],#app [data-etage]").forEach(el=>{vorher[flipKey(el)]=el.getBoundingClientRect().top});
  document.querySelectorAll("#app [data-k]").forEach(el=>{const sec=el.closest("[data-room]");innen[el.dataset.k]={sec:sec?flipKey(sec):"",off:el.getBoundingClientRect().top-(sec?sec.getBoundingClientRect().top:0)}});
  update();
  const fuer=k=>{for(const [a,b] of Object.entries(map))if(b===k)return a;return k};
  if(!ruhig()){
    const E={duration:340,easing:"cubic-bezier(.2,.8,.25,1)"};
    document.querySelectorAll("#app [data-room],#app [data-etage]").forEach(el=>{
      const k=flipKey(el),alt=vorher[fuer(k)];
      if(alt===undefined){el.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],E);return}
      const dy=alt-el.getBoundingClientRect().top;
      if(Math.abs(dy)>1)el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],E);
    });
    document.querySelectorAll("#app [data-k]").forEach(el=>{
      const v=innen[el.dataset.k],sec=el.closest("[data-room]"),sk=sec?flipKey(sec):"";
      if(!v){el.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],E);return}
      if(fuer(sk)!==v.sec)return;
      const dy=v.off-(el.getBoundingClientRect().top-(sec?sec.getBoundingClientRect().top:0));
      if(Math.abs(dy)>1)el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],E);
    });
  }
  if(mark){const el=[...document.querySelectorAll("#app [data-room],#app [data-etage],#app [data-k]")].find(e=>flipKey(e)===mark);
    if(el){const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90)el.scrollIntoView({block:"center",behavior:ruhig()?"auto":"smooth"})}}
}
function raumSchieben(job,k,d){

  const nb=gleich[pos+d];
  if(nb!==undefined){[L[i],L[nb]]=[L[nb],L[i]];job.raeume=L;flip(()=>{persist(job);render()},{},"r:"+k);return}
  const ze=EL[EL.indexOf(e)+d];if(ze===undefined)return;
  const nk=KEY(ze,kName(k));
  if(L.includes(nk)){toast(`„${kR(k)}“ gibt es in ${ze?etName(ze):"Ohne Etage"} schon`);return}
  L.splice(i,1);
  const ziel=L.map((x,j)=>[x,j]).filter(([x])=>kE(x)===ze).map(([,j])=>j);
  const at=ziel.length?(d<0?ziel[ziel.length-1]+1:ziel[0]):L.length;
  L.splice(at,0,nk);
  if(ze&&!(job.etagen||[]).includes(ze))job.etagen=EL.filter(Boolean);
  flip(()=>{
    job.raeume=L;
    for(const p of job.positionen)if(PK(p)===k)p.etage=ze;
    for(const x of job.extras||[])if(XK(x)===k)x.etage=ze;
    persist(job);render();

  toast(`${kR(k)} → ${ze?etName(ze):"Ohne Etage"}`);
}

function browserDownload(filename,data){/* außerhalb von Claude (eigene Webseite): normaler Browser-Download */
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".json")?"application/json":"application/octet-stream"});

  setTimeout(()=>URL.revokeObjectURL(u),10000);
}

/* Ankreuzfelder im PDF, Kästchen rechts (letzte Spalte).
   Chrome/Edge zeichnen ein angekreuztes Feld nach dem Antippen selbst neu und färben anklickbare Felder blau.
   Darum: kleines Ankreuzfeld nur auf dem Kästchen; die gelbe Zeile ist ein eigenes, schreibgeschütztes, anfangs verstecktes Feld,
   das ein kleines Skript am Ankreuzfeld ein- und ausblendet. Die gelbe Zeile zeichnet alle Spalten (auch mehrzeilig) neu. */
function markierFelder(doc,zellen,BOX){
  const k=72/25.4,f=n=>n.toFixed(2);
  const fid=doc.getFont("helvetica","normal").id,fidB=doc.getFont("helvetica","bold").id;
  const WA={"–":"\x96","—":"\x97","„":"\x84","“":"\x93","”":"\x94","‚":"\x82","‘":"\x91","’":"\x92","€":"\x80","…":"\x85"};
  const pe=s=>String(s).replace(/[\\()]/g,"\\$&").replace(/[–—„“”‚‘’€…]/g,c=>WA[c]);
  const xo=(fo,stream,W,H)=>{const x=doc.AcroFormAppearance.CheckBox.OffPushDown(fo);x.BBox=[0,0,+f(W),+f(H)];x.stream=stream||" ";return x};
  const fest=(o,key,val)=>Object.defineProperty(o,key,{value:val,configurable:false,enumerable:true,writable:true});
  zellen.forEach((z,i)=>{
    if(!z||z.c.length<3||z.c.some(c=>!c))return;
    const C=z.c,box=C[C.length-1],W=C.reduce((s,c)=>s+c.w,0)*k,H=C[0].h*k;
    const xs=[];let acc=0;for(const c of C){xs.push(acc);acc+=c.w*k}
    const b=BOX*k,bx=xs[C.length-1]+(box.w*k-b)/2,by=(H-b)/2;
    const st=["q","1 0.969 0.6 rg",`0 0 ${f(W)} ${f(H)} re f`,"0.72 G 0.4 w",`0.2 0.2 ${f(W-0.4)} ${f(H-0.4)} re S`];
    for(let j=1;j<C.length;j++)st.push(`${f(xs[j])} 0 m ${f(xs[j])} ${f(H)} l S`);
    st.push("0 G 0.85 w",`${f(bx)} ${f(by)} ${f(b)} ${f(b)} re S`);
    C.slice(0,-1).forEach((c,j)=>{
      const fs=c.fs,lh=fs*1.15,n=c.tl.length,top=c.va==="top"?H-c.pt*k:H/2+n*lh/2;
      const rgb=a=>`${(a[0]/255).toFixed(3)} ${(a[1]/255).toFixed(3)} ${(a[2]/255).toFixed(3)}`;
      st.push(`${rgb(c.rgb)} rg`);
      c.tl.forEach((line,li)=>{
        if(!line)return;
        doc.setFont("helvetica",c.bold?"bold":"normal");
        const base=top-fs*0.82-li*lh,tw=doc.getStringUnitWidth(line)*fs;
        const x=c.al==="right"?xs[j]+c.w*k-c.pr*k-tw:c.al==="center"?xs[j]+(c.w*k-tw)/2:xs[j]+c.pl*k;
        st.push("BT",`/${c.bold?fidB:fid} ${fs} Tf`,`${f(x)} ${f(base)} Td`,`(${pe(line)}) Tj`,"ET");
      });
      if(c.subs){const y0=top-c.nl*lh-0.4*k,x0=xs[j]+c.pl*k;let l0=0;
        for(const s of c.subs){const sl=s.fs*1.15;st.push(`${rgb(s.rgb)} rg`,`${rgb(s.rgb)} RG`);
          s.tl.forEach((line,li)=>{const base=y0-s.fs*0.82-(l0+li)*sl,x=x0+(s.hak?3*k:0);
            if(li===0&&s.hak)st.push("0.85 w",`${f(x0+0.1*k)} ${f(base+1.1*k)} m ${f(x0+0.9*k)} ${f(base+0.3*k)} l ${f(x0+2.5*k)} ${f(base+2.1*k)} l S`);
            st.push("BT",`/${s.bold?fidB:fid} ${s.fs} Tf`,`${f(x)} ${f(base)} Td`,`(${pe(line)}) Tj`,"ET")});l0+=s.tl.length}
        st.push("0 G")}
    });
    st.push("Q");const gelb=st.join("\n");
    doc.setPage(z.seite);
    const hl=new doc.AcroFormCheckBox();
    hl.fieldName="zeile_"+i;hl.x=C[0].x;hl.y=C[0].y;hl.width=W/k;hl.height=C[0].h;
    hl.appearanceStreamContent={N:{On:fo=>xo(fo,gelb,W,H),Off:fo=>xo(fo," ",W,H)}};
    hl.appearanceState="On";hl.value="On";hl.readOnly=true;hl.F=6; // versteckt, bis angekreuzt wird
    doc.addField(hl);
    const S=BOX,w=S*k;
    const haken=["q","0 G 1.4 w",`${f(w*.18)} ${f(w*.5)} m ${f(w*.42)} ${f(w*.2)} l ${f(w*.85)} ${f(w*.85)} l S`,"Q"].join("\n");
    const cb=new doc.AcroFormCheckBox();
    cb.fieldName="warenkorb_"+i;cb.x=box.x+(box.w-S)/2;cb.y=box.y+(box.h-S)/2;cb.width=S;cb.height=S;
    cb.appearanceStreamContent={N:{On:fo=>xo(fo,haken,w,w),Off:fo=>xo(fo," ",w,w)},D:{On:fo=>xo(fo,haken,w,w),Off:fo=>xo(fo," ",w,w)}};
    cb.appearanceState="Off";cb.value="Off";
    fest(cb,"AA",`<</U <</S /JavaScript /JS (var f=this.getField\\("zeile_${i}"\\);if\\(f\\){f.display=\\(event.target.value=="Off"\\)?display.hidden:display.visible;})>>>>`);
    doc.addField(cb);
  });
}

function letzteSicherung(){try{return +localStorage.getItem("aufmass_letzteSicherung")||null}catch(e){return null}}
function tageSeit(ts){return ts?Math.floor((Date.now()-ts)/86400000):null}
function sicherungHtml(){
  if(!jobs.length)return "";
  const t=tageSeit(letzteSicherung()),alt=t==null||t>=7;

  return `<div class="sich${alt?" alt":""}"><h2>Datensicherung</h2><div class="muted" style="font-size:.88rem">${esc(stand)}${alt?" · Bitte jetzt Daten sichern, damit keine Aufmaße verloren gehen.":""}</div>

async function sicherungLaden(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("Die Datei ist keine gültige Datensicherung.");return}
  const liste=Array.isArray(d)?d:(d&&Array.isArray(d.aufmasse)?d.aufmasse:null);
  if(!liste){toast("Die Datei ist keine gültige Datensicherung.");return}
  let neu=0,akt=0;
  for(const a of liste){
    if(!a||!a.id||!Array.isArray(a.positionen))continue;
    const i=jobs.findIndex(j=>j.id===a.id);
    if(i<0){neu++;jobs.push(a)}else if((a.updatedAt||0)>(jobs[i].updatedAt||0)){akt++;jobs[i]=a}else continue;
    if(mode==="db"){const data=structuredClone(a);delete data.id;try{await db.collection("aufmasse").doc(a.id).set(data)}catch(e){toast("Wiederherstellen fehlgeschlagen");return}}
  }
  if(mode!=="db")lsSave();
  jobs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));render();
  toast(neu||akt?`Daten wiederhergestellt: ${neu} neu, ${akt} aktualisiert`:"Alle Aufmaße der Datensicherung sind schon vorhanden.");
}

    case "pos-save":{readEditorInputs();{const leer=draft.slots.findIndex(k=>k==="x:"||(String(k).startsWith("x:")&&!k.slice(2).trim()));if(leer>=0){toast("Bitte bei „Sonstiges“ ein Element eintragen");$("#sx_"+leer)?.focus();return}}const d={...draft};delete d._neu;delete d._active;delete d._progOffen;if(d.prog&&(gleichProg(d.prog,stdProg(job,d.montage))||!progLabel(d.prog)))delete d.prog;const i=job.positionen.findIndex(p=>p.id===d.id);if(i>=0)job.positionen[i]=d;else job.positionen.push(d);persist(job);toast(draft._neu?"Stelle hinzugefügt":"Stelle geändert");flip(closeLayer,{},"p:"+d.id);break}
    case "prog-auf":readEditorInputs();draft._progOffen=true;draft.prog=draft.prog||{...stdProg(job,draft.montage)};renderEditor(job);setTimeout(()=>$("#e_farbe")?.focus(),50);break;
    case "prog-std":readEditorInputs();draft.prog=null;draft._progOffen=false;renderEditor(job);break;
    case "pos-del":job.positionen=job.positionen.filter(p=>p.id!==draft.id);persist(job);toast("Stelle gelöscht");closeLayer();break;
    case "extra":openExtra(job);break;
    case "extra-del":job.extras=(job.extras||[]).filter(x=>x.id!==xdraft.id);persist(job);toast("Artikel gelöscht");closeLayer();break;
    case "raum-save":raumSpeichern(job);break;
    case "etage-add":if(job)openNeuEtage(job);break;
    case "etage-neu":etageAnlegen(job,$("#et_name").value);break;
    case "etage-save":etageSpeichern(job);break;
    case "etage-del":etDel=true;openEtage(job,etAlt);break;
    case "etage-del-no":etDel=false;openEtage(job,etAlt);break;
    case "etage-del-yes":etageLoeschen(job);break;
    case "raum-del":raumDel=true;openRaum(job,raumAlt);break;
    case "raum-del-no":raumDel=false;openRaum(job,raumAlt);break;
    case "raum-del-yes":job.raeume=raumListe(job).filter(r=>r!==raumAlt);job.positionen=job.positionen.filter(p=>PK(p)!==raumAlt);job.extras=(job.extras||[]).filter(x=>XK(x)!==raumAlt);persist(job);toast("Raum gelöscht");closeLayer();break;
    case "extra-save":{const t=$("#x_text").value.trim();if(!t){$("#x_text").focus();return}const rk=$("#x_raum").value;const d={id:xdraft.id,text:t,anzahl:Math.max(1,parseInt($("#x_anz").value)||1),etage:rk?kE(rk):"",raum:rk?kName(rk):""};job.extras=job.extras||[];const i=job.extras.findIndex(x=>x.id===d.id);if(i>=0)job.extras[i]=d;else job.extras.push(d);persist(job);toast(xdraft._neu?"Artikel hinzugefügt":"Artikel geändert");flip(closeLayer,{},"x:"+d.id);break}
    case "del":$("#layer").innerHTML=`<div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Aufmaß löschen"><h2>Aufmaß löschen?</h2><p style="margin:0"><b>„${esc(jobName(job))}“</b> mit allen Positionen endgültig löschen?</p><p class="muted" style="margin:0">Das kann nicht rückgängig gemacht werden.</p><div class="row"><span style="flex:1"></span><button class="btn" data-act="close">Abbrechen</button><button class="btn danger" data-act="del-yes">Endgültig löschen</button></div></div></div>`;break;
    case "del-yes":$("#layer").innerHTML="";removeJob(job.id);openId=null;toast("Aufmaß gelöscht");render();break;
    case "pdf":case "pdf2":exportPDF(job);break;
    case "mk-reset":pendingReset=true;render();break;
    case "mk-reset-no":pendingReset=false;render();break;
    case "mk-reset-yes":job.markiert={};pendingReset=false;persist(job);toast("Markierungen entfernt");render();break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.dataset?.sxslot!==undefined&&draft)slotsAuffrischen();
});
document.addEventListener("input",e=>{
  if(e.target.dataset?.sxslot!==undefined&&draft){const i=+e.target.dataset.sxslot,t=e.target.value;draft.slots[i]=t.trim()?textZuSlot(t):"x:";e.target.closest(".sonst")?.classList.add("aktiv");return}
  if(e.target.id==="suche"){suche=e.target.value;listDelete=null;const l=$("#joblist");if(l)l.innerHTML=renderJobCards();return}
  if(e.target.id==="e_hersteller"){const h=Object.keys(PROG_JE).find(x=>nA(x)===nA(e.target.value.trim())),f=$("#e_programm");const ph=herstellerVonProgramm(f.value);if(h&&(!f.value.trim()||(ph&&ph!==h)))f.value=STD_PROG[h]||"";return}
  if(e.target.id==="e_programm"){const h=herstellerVonProgramm(e.target.value),f=$("#e_hersteller");if(h&&nA(h)!==nA(f.value))f.value=h;return}
  const k=e.target.dataset.kopf;if(!k)return;const job=jobs.find(j=>j.id===openId);if(!job)return;
  job[k]=e.target.value;
  if(k==="programm"){const h=herstellerVonProgramm(e.target.value);if(h&&h!==job.hersteller){job.hersteller=h;const f=$("#k_hersteller");if(f)f.value=h}}
  if(k==="hersteller"){const h=Object.keys(PROG_JE).find(x=>nA(x)===nA(e.target.value.trim()));const ph=herstellerVonProgramm(job.programm);if(h&&(!job.programm||(ph&&ph!==h))){job.programm=STD_PROG[h]||"";const f=$("#k_programm");if(f)f.value=job.programm}}
  persist(job);
});
init();
</script>
